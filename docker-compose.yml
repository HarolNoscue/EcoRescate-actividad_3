name: ecorescate
x-python-common: &python-common
  build: .
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy
  environment: &python-env
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  commands:
    <<: *python-common
    command: uvicorn command_service.api:app --host 0.0.0.0 --port 8000
    environment:
      <<: *python-env
      COMMAND_DB: /data/command.sqlite3
    volumes:
      - command_data:/data
    ports:
      - "8001:8000"

  outbox:
    <<: *python-common
    command: python -m command_service.outbox_worker
    environment:
      <<: *python-env
      COMMAND_DB: /data/command.sqlite3
    volumes:
      - command_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      commands:
        condition: service_started

  queries:
    <<: *python-common
    command: uvicorn query_service.api:app --host 0.0.0.0 --port 8000
    environment:
      <<: *python-env
      QUERY_DB: /data/query.sqlite3
    volumes:
      - query_data:/data
    ports:
      - "8002:8000"

  projector:
    <<: *python-common
    command: python -m query_service.consumer
    environment:
      <<: *python-env
      QUERY_DB: /data/query.sqlite3
    volumes:
      - query_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      queries:
        condition: service_started

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - commands
      - queries
volumes:
  command_data:
  query_data:
  rabbit_data:
